name: First-party patient EHR event integration

on:
  push:
    branches: [integration/patient-ehr-events-20261102]

permissions:
  contents: read

jobs:
  cross-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout combined integration branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Syntax verification
        run: PYTHONPATH=src python -m compileall -q src
      - name: Cross-module patient EHR and ordered event contract
        run: PYTHONPATH=src python -m unittest discover -s tests -p test_patient_ehr_event_integration.py -v
      - name: Imported first-party component regression suites
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -p test_patient_registry.py -v
          PYTHONPATH=src python -m unittest discover -s tests -p test_clinical_encounters.py -v
          PYTHONPATH=src python -m unittest discover -s tests -p test_platform_events.py -v
      - name: Complete repository unit and HTTP suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
