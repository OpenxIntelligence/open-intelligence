name: Synthetic semantic model runner and separate scorer (no real model)

on:
  push:
    branches: [research/semantic-governed-runner-20261104]
  pull_request:
    branches: [research/semantic-adversarial-challenge-20261104]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NVIDIA_API_KEY: ''
      DEFAULT_MODELS_API_KEY: ''
      REASONING_API_KEY: ''
      EMBED_API_KEY: ''
      CONNECTION_STRINGS: ''
      LANGCHAIN_TRACING_V2: 'false'
      LANGSMITH_TRACING: 'false'
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Compile and test synthetic runner and prior semantic suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p semantic-runner-evidence
          python -m compileall -q tools/semantic_local_model_runner.py tools/semantic_model_scorer.py tests/test_semantic_governed_runner.py
          python -m unittest discover -s tests -p 'test_semantic*.py' -v 2>&1 | tee semantic-runner-evidence/tests.txt
      - name: Score a scripted test double, explicitly not NVIDIA inference
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,"tools")
          sys.path.insert(0,"tests")
          from semantic_question_packet import make_packet,validate_packet
          from semantic_local_model_runner import validate_run
          from semantic_model_scorer import score_run
          from test_semantic_governed_runner import CHALLENGE, ORIGINAL, make_full_run
          packet=make_packet(CHALLENGE,ORIGINAL)
          assert validate_packet(packet,CHALLENGE,ORIGINAL)["task_count"]==72
          run=make_full_run(packet)
          assert validate_run(run,packet)["complete"]
          report=score_run(run,packet,CHALLENGE,ORIGINAL)
          assert report["reference_cases"]==72
          assert report["unsafe_false_mappings"]==1
          assert report["false_join_mappings"]==1
          assert report["counts"]["negative_invalid"]==1
          assert report["experimental_stop_triggered"]
          assert not report["provider_provenance_verified"]
          assert not report["nvidia_auto_ontology_model_verified"]
          assert not report["clinical_validation"]
          assert not report["production_adoption_approved"]
          Path("semantic-runner-evidence/test-double-run.json").write_text(json.dumps(run,indent=2,sort_keys=True)+"\n")
          Path("semantic-runner-evidence/test-double-score.json").write_text(json.dumps(report,indent=2,sort_keys=True)+"\n")
          print("Scripted test-double runner and separated scorer: PASS; no NVIDIA inference")
          PY
      - name: Commit/source hash receipt and nonclaims
        if: always()
        shell: bash
        run: |
          mkdir -p semantic-runner-evidence
          python - <<'PY'
          import hashlib,json,platform,subprocess,os
          from pathlib import Path
          paths=["tools/semantic_local_model_runner.py","tools/semantic_model_scorer.py",
                 "tests/test_semantic_governed_runner.py",".github/workflows/semantic-governed-runner.yml"]
          receipt={"checkout_commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),
                   "run_id":os.environ.get("GITHUB_RUN_ID"),"python":platform.python_version(),
                   "source_sha256":{p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths},
                   "inference_execution":"scripted_test_double_only",
                   "real_nvidia_inference":False,"patient_data":False,
                   "independent_adjudication":False,"clinical_validation":False}
          Path("semantic-runner-evidence/receipt.json").write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY
      - name: Preserve repeatable synthetic safety evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oi-governed-runner-${{ github.run_id }}-${{ github.run_attempt }}
          path: semantic-runner-evidence/
          if-no-files-found: warn
          retention-days: 14
