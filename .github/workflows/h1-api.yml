name: H1 API composition root (synthetic only)

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/audit_ci_data_boundaries.py'
      - '.github/workflows/h1-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h1-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-postgres-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONPATH: apps/api/src
      OI_API_ENVIRONMENT: synthetic
      # Public credentials for this disposable CI database only.
      OI_API_DATABASE_URL: postgresql+pg8000://oi_api:oi_h1_synthetic_only@127.0.0.1:5432/oi_api_test_shell
      OI_API_TEST_DATABASE_URL: postgresql+pg8000://oi_api:oi_h1_synthetic_only@127.0.0.1:5432/oi_api_test_shell
      OI_API_CONNECT_TIMEOUT_SECONDS: '2'
      OI_API_RUN_DATABASE_TESTS: '1'
      COMPOSE_PROJECT_NAME: oi-h1-ci-${{ github.run_id }}-${{ github.run_attempt }}
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: oi_api
          POSTGRES_PASSWORD: oi_h1_synthetic_only
          POSTGRES_DB: oi_api_test_shell
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U oi_api -d oi_api_test_shell"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      # Official tag refs inspected 2026-11-02: checkout v4.4.0 and
      # setup-python v5.6.0. No pull_request_target or repository secrets.
      - name: Check out the exact proposed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify checkout identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == os.environ['EXPECTED_HEAD'], (actual, os.environ['EXPECTED_HEAD'])
          print('Verified proposed source head:', actual)
          PY
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Check the inherited synthetic-data boundary
        run: python tools/audit_ci_data_boundaries.py
      - name: Download only hash-locked wheels
        run: >-
          python -m pip download --require-hashes --only-binary=:all:
          --dest /tmp/oi-h1-wheels -r apps/api/requirements.lock
      - name: Verify wheel rights and write the resolved package inventory
        run: python apps/api/tools/check_dependencies.py --wheel-dir /tmp/oi-h1-wheels --sbom /tmp/oi-h1-sbom.json
      - name: Install verified wheels without network resolution
        run: |
          python -m pip install --require-hashes --no-index --find-links /tmp/oi-h1-wheels -r apps/api/requirements.lock
          python -m pip check
          python --version
      - name: Apply the explicit migration to the disposable database
        run: python -m oi_api.migrate upgrade head
      - name: Run contracts and real PostgreSQL migration tests
        run: |
          python - <<'PY'
          import sys
          import unittest
          suite = unittest.defaultTestLoader.discover('apps/api/tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              print('PostgreSQL CI must not skip database acceptance:', result.skipped, file=sys.stderr)
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun and not result.skipped else 1)
          PY
      - name: Preserve the original synthetic prototype regression
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Preserve the original loopback browser journeys
        env:
          PYTHONPATH: src
        run: |
          python tests/browser_journey.py
          python tests/patient_mission_browser_journey.py
      - name: Validate and start the actual container composition
        run: |
          docker compose --file apps/api/compose.yaml config --quiet
          docker compose --file apps/api/compose.yaml up --build --detach api
      - name: Verify loopback contracts and API restart
        run: |
          python - <<'PY'
          import json
          import subprocess
          import time
          import urllib.error
          import urllib.request

          base = 'http://127.0.0.1:8000'
          compose = ['docker', 'compose', '--file', 'apps/api/compose.yaml']

          def read(path):
              with urllib.request.urlopen(base + path, timeout=2) as response:
                  assert response.status == 200, (path, response.status)
                  assert response.headers.get_content_type() == 'application/json', path
                  return json.load(response)

          def verify(phase):
              deadline = time.monotonic() + 45
              while True:
                  try:
                      ready = read('/health/ready')
                      break
                  except (urllib.error.URLError, TimeoutError):
                      if time.monotonic() >= deadline:
                          raise
                      time.sleep(0.5)
              assert ready['status'] == 'ready', ready
              assert ready['database']['status'] == 'ready', ready
              assert read('/health') == {'status': 'ok'}
              manifest = read('/v1')
              assert manifest['stage'] == 'synthetic_shell', manifest
              assert manifest['patient_data_enabled'] is False, manifest
              assert manifest['capabilities'] == [], manifest
              schema = read('/v1/openapi.json')
              assert schema['openapi'].startswith('3.'), schema.get('openapi')
              assert {'/health', '/health/ready', '/v1'} <= set(schema['paths'])
              print(phase + ': real loopback health, readiness, manifest and OpenAPI passed')

          migration_id = subprocess.check_output(compose + ['ps', '--all', '--quiet', 'migrate'], text=True).strip()
          assert migration_id, 'one-shot migration container missing'
          migration = json.loads(subprocess.check_output(['docker', 'inspect', migration_id], text=True))[0]
          assert migration['State']['Status'] == 'exited', migration['State']['Status']
          assert migration['State']['ExitCode'] == 0, migration['State']['ExitCode']
          api_id = subprocess.check_output(compose + ['ps', '--quiet', 'api'], text=True).strip()
          api = json.loads(subprocess.check_output(['docker', 'inspect', api_id], text=True))[0]
          bindings = api['NetworkSettings']['Ports'].get('8000/tcp')
          assert bindings == [{'HostIp': '127.0.0.1', 'HostPort': '8000'}], bindings
          db_id = subprocess.check_output(compose + ['ps', '--quiet', 'db'], text=True).strip()
          db = json.loads(subprocess.check_output(['docker', 'inspect', db_id], text=True))[0]
          assert not any(db['NetworkSettings']['Ports'].values()), db['NetworkSettings']['Ports']
          networks = json.loads(subprocess.check_output(
              ['docker', 'network', 'inspect', *api['NetworkSettings']['Networks']], text=True))
          internal = {network['Name'] for network in networks if network['Internal']}
          assert len(internal) == 1 and len(networks) == 2, 'API needs internal DB and frontend bridge networks'
          assert set(db['NetworkSettings']['Networks']) == internal, 'Database must stay internal-only'
          assert set(migration['NetworkSettings']['Networks']) == internal, 'Migrator must stay internal-only'
          print('Verified actual loopback port mapping and internal-only database/migrator')
          verify('After one-shot migration')
          subprocess.run(compose + ['restart', 'api'], check=True)
          verify('After API-only restart')
          PY
      - name: Record resolved container identities and application packages
        run: |
          docker image inspect postgres:16.15-bookworm oi-h1-api:synthetic --format '{{.Id}} {{json .RepoDigests}}'
          python -m pip list --format=json
          python - <<'PY'
          from pathlib import Path
          print(Path('/tmp/oi-h1-sbom.json').read_text())
          PY
      - name: Show container diagnostics on failure
        if: failure()
        run: docker compose --file apps/api/compose.yaml logs --no-color --tail 100
      - name: Remove only this run's disposable composition
        if: always()
        run: docker compose --file apps/api/compose.yaml down --volumes
