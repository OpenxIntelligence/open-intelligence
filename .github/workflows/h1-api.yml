name: H1 API composition root (synthetic only)

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/audit_ci_data_boundaries.py'
      - '.github/workflows/h1-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h1-api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-postgres-contract:
    runs-on: ubuntu-24.04
    # Verified #469 run 41883746990 took nearly 30 minutes with all seven
    # recovery gates. Preserve them and allow populated migration acceptance.
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONPATH: apps/api/src:src
      OI_API_ENVIRONMENT: synthetic
      # Public credentials for this disposable CI database only.
      OI_API_DATABASE_URL: postgresql+pg8000://oi_api:oi_h1_synthetic_only@127.0.0.1:5432/oi_api_test_shell
      OI_API_TEST_DATABASE_URL: postgresql+pg8000://oi_api:oi_h1_synthetic_only@127.0.0.1:5432/oi_api_test_shell
      OI_API_CONNECT_TIMEOUT_SECONDS: '2'
      OI_API_RUN_DATABASE_TESTS: '1'
      COMPOSE_PROJECT_NAME: oi-h1-ci-${{ github.run_id }}-${{ github.run_attempt }}
    services:
      postgres:
        image: postgres:16.15-bookworm@sha256:5264710be20f409750ac6dc4e5706dcef929c87e241605463f0f9aefa932a8d9
        env:
          POSTGRES_USER: oi_api
          POSTGRES_PASSWORD: oi_h1_synthetic_only
          POSTGRES_DB: oi_api_test_shell
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U oi_api -d oi_api_test_shell"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      # Official tag refs inspected 2026-11-02: checkout v4.4.0 and
      # setup-python v5.6.0. No pull_request_target or repository secrets.
      - name: Check out the exact proposed head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify checkout identity
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert actual == os.environ['EXPECTED_HEAD'], (actual, os.environ['EXPECTED_HEAD'])
          print('Verified proposed source head:', actual)
          PY
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Select matching PostgreSQL 16 backup clients
        run: |
          test -x /usr/lib/postgresql/16/bin/pg_dump
          test -x /usr/lib/postgresql/16/bin/pg_restore
          test -x /usr/lib/postgresql/16/bin/psql
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Check the inherited synthetic-data boundary
        run: python tools/audit_ci_data_boundaries.py
      - name: Prepare hash-locked runtime wheels with code-only pydicom
        run: python apps/api/tools/prepare_dependencies.py --wheel-dir /tmp/oi-h1-wheels
      - name: Verify wheel rights and write the resolved package inventory
        run: |
          mkdir -p verification-api
          python apps/api/tools/check_dependencies.py --wheel-dir /tmp/oi-h1-wheels --sbom verification-api/api.cdx.json
          cp apps/api/THIRD_PARTY_NOTICES.md verification-api/
      - name: Install verified wheels without network resolution
        run: |
          python -m pip install --force-reinstall --no-deps --require-hashes --no-index --find-links /tmp/oi-h1-wheels -r apps/api/requirements.lock
          python -m pip check
          python --version
      - name: Apply the explicit migration to the disposable database
        run: python -m oi_api.migrate upgrade head
      - name: Verify source purpose compatibility before the full suite
        run: |
          python - <<'PYTEST'
          import unittest
          suite = unittest.defaultTestLoader.discover('apps/api/tests', pattern='test_source_read_authority.py')
          suite.addTests(unittest.defaultTestLoader.discover('apps/api/tests', pattern='test_source_purpose_migrations.py'))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          assert result.testsRun and result.wasSuccessful() and not result.skipped
          PYTEST
      - name: Verify oncology draft custody and populated upgrades before the full suite
        run: |
          python - <<'PYTEST'
          import unittest
          suite = unittest.defaultTestLoader.discover('apps/api/tests', pattern='test_episode*.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun and not result.skipped else 1)
          PYTEST
      - name: Verify governed encounter relay and process-death recovery
        run: |
          python - <<'PYTEST'
          import unittest
          suite = unittest.defaultTestLoader.discover('apps/api/tests', pattern='test_encounter*.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun and not result.skipped else 1)
          PYTEST
      - name: Verify joined EHR, laboratory follow-up and migration boundaries
        run: |
          python - <<'PYTEST'
          import unittest
          suite = unittest.defaultTestLoader.discover('apps/api/tests', pattern='test_ehr_laboratory_convergence.py')
          suite.addTests(unittest.defaultTestLoader.discover('apps/api/tests', pattern='test_laboratory_followthrough*.py'))
          # These RESTRICT fixtures must release every declared function after
          # testing populated/current heads, without hiding unknown dependencies.
          suite.addTests(unittest.defaultTestLoader.discover('apps/api/tests', pattern='test_image_evidence_migration.py'))
          suite.addTests(unittest.defaultTestLoader.discover('apps/api/tests', pattern='test_registry_migrations.py'))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun and not result.skipped else 1)
          PYTEST
      - name: Verify both populated laboratory and manual-task upgrade paths first
        run: |
          python - <<'PYTEST'
          import unittest
          suite = unittest.defaultTestLoader.discover('apps/api/tests', pattern='test_lab_manual_convergence.py')
          suite.addTests(unittest.defaultTestLoader.loadTestsFromName(
              'test_document_image_convergence.DocumentImageConvergenceContractTests.'
              'test_single_join_preserves_both_published_document_and_image_histories'))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun == 5 and not result.skipped else 1)
          PYTEST
      - name: Run contracts and real PostgreSQL migration tests
        run: |
          python - <<'PY'
          import sys
          import unittest
          suite = unittest.defaultTestLoader.discover('apps/api/tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              print('PostgreSQL CI must not skip database acceptance:', result.skipped, file=sys.stderr)
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun and not result.skipped else 1)
          PY
      - name: Preserve the original synthetic prototype regression
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Preserve the original loopback browser journeys
        env:
          PYTHONPATH: src
        run: |
          python tests/browser_journey.py
          python tests/patient_mission_browser_journey.py
      - name: Verify actual patient HTTP, restart, backup restore and access revocation
        run: python apps/api/tools/verify_registry_compose.py
      - name: Verify source HTTP, fresh authority, source receipts and restored originals
        env:
          OI_SOURCE_ACCEPTANCE_FILE: verification-api/source-document-recovery.json
        run: python apps/api/tools/verify_sources_compose.py
      - name: Verify native FHIR laboratory custody, amendments and recovery
        env:
          OI_LABORATORY_TASK_ACCEPTANCE_FILE: verification-api/laboratory-followthrough-recovery.json
        run: python apps/api/tools/verify_fhir_laboratory_compose.py
      - name: Verify exact image originals, source amendments, image grants and restored custody
        run: python apps/api/tools/verify_images_compose.py
      - name: Verify canonical review returns, history, retry recovery and backup restore
        run: python apps/api/tools/verify_reviews_compose.py
      - name: Verify canonical question follow-through, exact retries and restored history
        run: python apps/api/tools/verify_followthrough_compose.py
      - name: Verify case evidence, report history, rights changes and complete recovery
        env:
          OI_EVIDENCE_ACCEPTANCE_FILE: verification-api/evidence-recovery.json
        run: python apps/api/tools/verify_evidence_compose.py
      - name: Record resolved container identities and application packages
        run: |
          python - <<'PYIMAGES'
          import json
          from pathlib import Path
          import subprocess
          pins = json.loads(Path('apps/api/container-image-pins.json').read_text())
          postgres = pins['postgres']
          info = json.loads(subprocess.check_output(['docker', 'image', 'inspect', postgres['reference']]))[0]
          if (info['Id'], info['Os'] + '/' + info['Architecture']) != (postgres['config'], postgres['platform']):
              raise SystemExit('Unexpected PostgreSQL platform or image configuration')
          Path('verification-api').mkdir(exist_ok=True)
          Path('verification-api/postgres-image.json').write_text(json.dumps({
              'reference': postgres['reference'], 'platform': postgres['platform'], 'observedConfig': info['Id'],
          }, indent=2) + '\n')
          PYIMAGES
          docker image inspect oi-h1-api:synthetic --format '{{.Id}} {{json .RepoDigests}}'
          python -m pip list --format=json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h1-evidence-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-api/
          if-no-files-found: warn
          retention-days: 7
