name: Synthetic-only research interface regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/research/**'
      - '.github/workflows/public-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Independent fictional parser and projection regressions
        run: |
          set -o pipefail
          mkdir -p research-results
          python -m unittest discover -s tools/research -p 'test_*.py' -v 2>&1 | tee research-results/tests.txt
      - name: Reproducibility and boundary receipt
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          paths=[p for p in Path('tools/research').glob('*.py')]+[Path('.github/workflows/public-research.yml')]
          d={'checkout':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
             'source_sha256':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths},
             'live_patient_case_catalog_invoked':False,'live_public_subject_data_invoked':False,
             'clinical_validation':False}
          Path('research-results').mkdir(exist_ok=True)
          Path('research-results/receipt.json').write_text(json.dumps(d,indent=2))
          PY
      - name: Save fictional tests and source receipts only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-research-regression
          path: research-results/
          if-no-files-found: error
          retention-days: 7
