name: Bounded public evidence research

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/research/**'
      - '.github/workflows/public-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      LANGCHAIN_TRACING_V2: 'false'
      LANGSMITH_TRACING: 'false'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Original fictional reducer and projection tests
        run: |
          set -o pipefail
          mkdir -p research-results
          python -m unittest discover -s tools/research -p 'test_*.py' -v 2>&1 | tee research-results/reducer-tests.txt
      - name: Research-only environment (not application dependencies)
        run: |
          python -m venv /tmp/oi-research-env
          /tmp/oi-research-env/bin/python -m pip install -r tools/research/requirements.lock
          /tmp/oi-research-env/bin/python -m pip freeze > research-results/research-environment.txt
      - name: Independent-process interrupt, authority and replay experiment
        run: /tmp/oi-research-env/bin/python tools/research/runtime_probe.py --output research-results/runtime.json
      - name: Bounded public TCIA and GDC structure audit
        if: always()
        run: python tools/research/public_evidence_probe.py --output research-results/public-data.json
      - name: Three-cohort lossless projection and follow-up query control
        if: always()
        run: python tools/research/gdc_projection_probe.py --output research-results/projection.json
      - name: Treatment and follow-up source semantics
        if: always()
        run: python tools/research/clinical_semantics_probe.py --output research-results/semantics.json
      - name: Reproducibility receipt
        if: always()
        run: |
          python - <<'PY'
          import hashlib,json,os,platform,subprocess
          from pathlib import Path
          paths=list(Path('tools/research').glob('*.py'))+[Path('tools/research/requirements.lock'),Path('.github/workflows/public-research.yml')]
          receipt={'checkout_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
                   'run_id':os.environ['GITHUB_RUN_ID'],'python':platform.python_version(),
                   'source_sha256':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths},
                   'raw_patient_data_published':False,'clinical_validation':False}
          Path('research-results').mkdir(exist_ok=True)
          Path('research-results/receipt.json').write_text(json.dumps(receipt,indent=2))
          print(json.dumps(receipt,indent=2))
          PY
      - name: Upload aggregate evidence and original research source only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-research-evidence
          path: |
            research-results/*.json
            research-results/reducer-tests.txt
            research-results/research-environment.txt
            tools/research/*.py
            tools/research/requirements.lock
            .github/workflows/public-research.yml
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
