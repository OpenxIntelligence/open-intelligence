name: Research reducers - independent synthetic fixtures only
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/research/**'
      - 'tests/test_personal_case_boundary.py'
      - '.github/workflows/public-research.yml'
permissions:
  contents: read
jobs:
  offline-research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Original fictional reducer tests - no live cohort or patient probes
        run: python -m unittest discover -s tools/research -p 'test_*.py' -v
      - name: No-data boundary in the ordinary suite
        run: python -m unittest discover -s tests -p 'test_personal_case_boundary.py' -v
# Live research probes and model/runtime experiments are not executed by this
# workflow. Re-enable only through a separately reviewed source/rights contract.
# HDF5 parser tests with the existing pinned scientific dependencies run in
# single-cell-analysis.yml. This job adds no runtime dependency or patient data.
