name: Research contract tests (fictional inputs only)

on:
  pull_request:
    paths:
      - 'tools/research/**'
      - '.github/workflows/public-research.yml'
      - 'tools/audit_ci_data_boundaries.py'
      - 'tests/test_ci_data_boundaries.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify no patient-case downloads are invoked by CI
        id: data_boundary
        run: python tools/audit_ci_data_boundaries.py
      - name: Verify CI no-download policy regression tests
        run: python -m unittest discover -s tests -p test_ci_data_boundaries.py -v
      - name: Fictional research reducer and contract tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p research-results
          python -m unittest discover -s tools/research -p 'test_*.py' -v 2>&1 | tee research-results/unit-tests.txt
      - name: Preserve reproducibility without patient files
        if: always()
        env:
          BOUNDARY_AUDIT_OUTCOME: ${{ steps.data_boundary.outcome }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          from tools.audit_ci_data_boundaries import build_receipt
          audited=[Path('tools/audit_ci_data_boundaries.py'),Path('.github/workflows/public-research.yml')]
          manifest=build_receipt(
              checkout=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              audit_outcome=os.environ.get('BOUNDARY_AUDIT_OUTCOME',''),
              source_sha256={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in audited}
          )
          Path('research-results').mkdir(exist_ok=True)
          Path('research-results/receipt.json').write_text(json.dumps(manifest,indent=2))
          PY
      - name: Upload only offline test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fictional-research-contracts
          path: |
            research-results/unit-tests.txt
            research-results/receipt.json
            tools/audit_ci_data_boundaries.py
          if-no-files-found: error
          retention-days: 7
