name: H1 private PACS patient authorization (synthetic only)
on:
  push:
    branches: [build/h1-authorized-imaging-20261102]
    paths: [tools/imaging-bootstrap.json, .github/workflows/h1-imaging.yml]
  pull_request:
    paths:
      - 'apps/api/**'
      - 'tools/imaging/**'
      - '.github/workflows/h1-imaging.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: h1-imaging-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: apps/api/src:src:.
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      OI_API_ENVIRONMENT: synthetic
      OI_API_RUN_DATABASE_TESTS: '1'
      OI_API_DATABASE_URL: postgresql+pg8000://oi_api:oi_h1_synthetic_only@127.0.0.1:5432/oi_api_test_shell
      OI_API_TEST_DATABASE_URL: postgresql+pg8000://oi_api:oi_h1_synthetic_only@127.0.0.1:5432/oi_api_test_shell
      PACS_SOURCE_COMMIT: e9b4334477a66967d290add9e0b9afa068f59dc0
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: oi_api
          POSTGRES_PASSWORD: oi_h1_synthetic_only
          POSTGRES_DB: oi_api_test_shell
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U oi_api -d oi_api_test_shell"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Compose the exact isolated candidate or verify the proposed head
        env:
          EVENT: ${{ github.event_name }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,os,subprocess,zlib
          from pathlib import Path
          run=lambda *args:subprocess.check_output(args,text=True).strip()
          assert run('git','rev-parse','HEAD')==os.environ['EXPECTED_HEAD']
          publication=Path(os.environ['RUNNER_TEMP'])/'publication';publication.mkdir()
          if os.environ['EVENT']=='push':
              spec=json.loads(Path('tools/imaging-bootstrap.json').read_text())
              assert spec['base_sha']=='911b0767c671ae6f40caf20f204aedf1e9df2ab0'
              assert spec['patch_parts']==[f'tools/imaging-bootstrap/part{i}.txt' for i in range(1,6)]
              parts=[]
              for path in spec['patch_parts']:
                  value=Path(path).read_text().strip()
                  repair=spec.get('repairs',{}).get(Path(path).name)
                  if repair:
                      assert hashlib.sha256(value.encode()).hexdigest()==repair['sha256']
                      for start,end,replacement in reversed(repair['edits']):
                          assert 0<=start<=end<=len(value)
                          value=value[:start]+replacement+value[end:]
                  parts.append(value)
              patch=zlib.decompress(base64.b64decode(''.join(parts),validate=True))
              assert len(patch)<150000 and hashlib.sha256(patch).hexdigest()==spec['patch_sha256']
              (publication/'candidate.patch').write_bytes(patch)
              correction=spec.get('correction_patch')
              subprocess.run(['git','fetch','--depth=1','origin',spec['base_sha']],check=True)
              subprocess.run(['git','checkout','--detach',spec['base_sha']],check=True)
              subprocess.run(['git','apply','--check',str(publication/'candidate.patch')],check=True)
              subprocess.run(['git','apply',str(publication/'candidate.patch')],check=True)
              if correction:
                  assert len(correction)<50000
                  cp=publication/'correction.patch';cp.write_text(correction)
                  subprocess.run(['git','apply','--check',str(cp)],check=True)
                  subprocess.run(['git','apply',str(cp)],check=True)
                  cp.unlink()
              subprocess.run(['git','add','-A'],check=True)
              assert run('git','write-tree')==spec['tree_sha']
              patch=subprocess.check_output(['git','diff','--cached','--binary'])
              (publication/'candidate.patch').write_bytes(patch)
              spec['patch_sha256']=hashlib.sha256(patch).hexdigest()
              (publication/'manifest.json').write_text(json.dumps({k:spec[k] for k in ('base_sha','tree_sha','patch_sha256')}))
          else:
              spec={'base_sha':run('git','rev-parse','HEAD'),'tree_sha':run('git','rev-parse','HEAD^{tree}')}
          Path('verification-artifacts').mkdir(exist_ok=True)
          Path('verification-artifacts/candidate.json').write_text(json.dumps(spec if 'patch_parts' not in spec else {k:spec[k] for k in ('base_sha','tree_sha','patch_sha256')},indent=2))
          subprocess.run(['git','archive','--format=zip','--output=verification-artifacts/source.zip',spec['tree_sha']],check=True)
          print('Verified candidate source tree',spec['tree_sha'])
          PY
          git diff --check
      - name: Verify unchanged runtime wheels before installation
        run: |
          python tools/audit_ci_data_boundaries.py
          python -m pip download --require-hashes --only-binary=:all: --dest /tmp/oi-h1-wheels -r apps/api/requirements.lock
          python apps/api/tools/check_dependencies.py --wheel-dir /tmp/oi-h1-wheels --sbom verification-artifacts/h1-runtime-sbom.json
          python -m pip install --require-hashes --no-index --find-links /tmp/oi-h1-wheels -r apps/api/requirements.lock
          python -m pip check
      - name: Actual PostgreSQL contracts including denied image disclosure
        run: |
          set -euo pipefail
          python -m oi_api.migrate upgrade head
          python - <<'PY' 2>&1 | tee verification-artifacts/h1-api-tests.txt
          import unittest
          result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('apps/api/tests'))
          assert result.wasSuccessful() and result.testsRun and not result.skipped, 'H1 tests failed or skipped'
          PY
          PYTHONPATH=src python -m unittest discover -s tests -v > verification-artifacts/reference-tests.txt 2>&1
      - name: Install isolated hash-pinned DICOM decoder
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r tools/imaging/requirements-h1-research.txt
      - name: Compile the exact existing PACS candidate with standalone storage
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/pacs-source"
          git -C "$RUNNER_TEMP/pacs-source" remote add origin https://github.com/knopkem/pacsnode.git
          git -C "$RUNNER_TEMP/pacs-source" fetch --depth=1 origin "$PACS_SOURCE_COMMIT"
          git -C "$RUNNER_TEMP/pacs-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/pacs-source" rev-parse HEAD)" = "$PACS_SOURCE_COMMIT"
          cd "$RUNNER_TEMP/pacs-source"
          grep -q 'licensed under the MIT License' NOTICE
          grep -Eq 'license[[:space:]]*=[[:space:]]*"MIT"' Cargo.toml
          sha256sum Cargo.lock > "$GITHUB_WORKSPACE/verification-artifacts/pacs-lock-sha256.txt"
          rustc --version > "$GITHUB_WORKSPACE/verification-artifacts/rustc-version.txt"
          cargo build --locked -p pacs-server --no-default-features --features standalone --bin pacsnode
      - name: H1 PG16 and genuine private-PACS bytes, denial, restart and restore
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          python -m tools.imaging.verify_h1_private_pacs verify \
            --binary "$RUNNER_TEMP/pacs-source/target/debug/pacsnode" \
            --postgres-container "$POSTGRES_CONTAINER" \
            --output verification-artifacts/h1-private-pacs.json 2>&1 | tee verification-artifacts/private-pacs-tests.txt
      - name: Preserve bounded evidence and exact source, never keys or image payloads
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h1-private-imaging-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-artifacts/
          retention-days: 7
      - name: Preserve verified publication input
        if: success() && github.event_name == 'push'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h1-image-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication/
          retention-days: 7
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/build/h1-authorized-imaging-20261102'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: '911b0767c671ae6f40caf20f204aedf1e9df2ab0'
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: h1-image-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/oi-image-publication
      - name: Publish only a new isolated branch from the verified patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          root=Path('/tmp/oi-image-publication');m=json.loads((root/'manifest.json').read_text())
          assert m['base_sha']=='911b0767c671ae6f40caf20f204aedf1e9df2ab0'
          assert hashlib.sha256((root/'candidate.patch').read_bytes()).hexdigest()==m['patch_sha256']
          subprocess.run(['git','apply','--check',str(root/'candidate.patch')],check=True)
          subprocess.run(['git','apply',str(root/'candidate.patch')],check=True)
          subprocess.run(['git','add','-A'],check=True)
          actual=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert actual==m['tree_sha']
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          allowed=('apps/api/','tools/imaging/','docs/engineering/','docs/superpowers/')
          assert all(p.startswith(allowed) or p=='.github/workflows/h1-imaging.yml' for p in paths)
          print('Publishing verified tree',actual,'files',len(paths))
          PY
          git config user.name 'Open Intelligence'
          git config user.email 'open-intelligence@outlook.com'
          git commit -m "feat(h1): authorized source-bound original imaging with private PACS acceptance"
          branch="integration/h1-authorized-imaging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test -z "$(git ls-remote --heads origin "$branch")"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$branch"
          printf 'Published branch: %s\nCommit: ' "$branch"
          git rev-parse HEAD
