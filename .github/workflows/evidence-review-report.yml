name: Permission-scoped evidence review report
on:
  pull_request:
    branches: [integration/inspectable-evidence-review-packet-20261102, main]
    paths:
      - 'src/open_intelligence/**'
      - 'tests/**'
      - '.github/workflows/evidence-review-report.yml'
      - 'docs/superpowers/plans/2026-11-02-permission-scoped-evidence-report.md'
  push:
    branches: [feat/permission-scoped-evidence-report-20261102]
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src:tests:.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Compile and focused real-module report checks
        shell: bash
        run: |
          set -o pipefail
          mkdir -p verification-artifacts
          python -m compileall -q src tests
          python -m unittest discover -s tests -p 'test_evidence_review_report.py' -v 2>&1 | tee verification-artifacts/report-tests.txt
      - name: Complete existing Python and HTTP regression
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee verification-artifacts/full-tests.txt
      - name: Record exact source
        if: always()
        run: |
          mkdir -p verification-artifacts
          git rev-parse HEAD > verification-artifacts/commit.txt
          git rev-parse HEAD^{tree} > verification-artifacts/tree.txt
          git archive --format=zip --output=verification-artifacts/source-under-test.zip HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: evidence-review-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-artifacts/
          if-no-files-found: error
          retention-days: 7
