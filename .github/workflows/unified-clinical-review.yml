name: Unified synthetic evidence and durable review acceptance

on:
  push:
    branches: [integration/unified-clinical-review-20261102]
  pull_request:
    branches: [integration/patient-evidence-durable-review-20261102]

permissions:
  contents: read

jobs:
  unified-review:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout pinned review source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Compile read-only source and tests
        run: PYTHONPATH=src python -m compileall -q src tests
      - name: Unified source quote and durable review contracts
        run: PYTHONPATH=src python -m unittest discover -s tests -p test_unified_clinical_review.py -v
      - name: Exact upstream quote review regression
        run: PYTHONPATH=src python -m unittest discover -s tests -p test_evidence_quote_review_integration.py -v
      - name: Exact upstream durable run review regression
        run: PYTHONPATH=src python -m unittest discover -s tests -p test_patient_research_run_review.py -v
      - name: Complete existing Python and HTTP regression suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
