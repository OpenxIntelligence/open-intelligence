name: Clinical Composer v2 broker/identity compatibility

on:
  push:
    branches: [integration/clinical-composer-v2-rights-reconciliation-20261102]
  pull_request:
    branches: [integration/patient-evidence-durable-review-20261102]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Python syntax
        run: PYTHONPATH=src python -m compileall -q src tests
      - name: Upstream rights broker v2 regressions
        run: PYTHONPATH=src python -m unittest discover -s tests -p test_composer_broker_context.py -v
      - name: Canonical patient/EHR/LIS/knowledge/durable review
        run: PYTHONPATH=src python -m unittest discover -s tests -p test_patient_research_run_review.py -v
      - name: All existing Python and HTTP tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
