name: Semantic contract quick gate (synthetic only)

on:
  pull_request:
    paths:
      - 'src/open_intelligence/semantic_contract.py'
      - 'src/open_intelligence/dependency_impact.py'
      - 'src/open_intelligence/h1_semantic_bridge.py'
      - 'src/open_intelligence/h1_question_impact.py'
      - 'tests/test_semantic_contract.py'
      - 'tests/test_dependency_impact.py'
      - 'tests/test_h1_semantic_bridge.py'
      - 'tests/test_h1_question_impact.py'
      - 'tests/test_semantic_h1_impact_integration.py'
      - 'apps/api/src/oi_api/source_questions.py'
      - 'apps/api/tests/test_semantic_owner_read.py'
      - 'apps/api/tests/test_canonical_question_flow.py'
      - '.github/workflows/semantic-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  isolated-unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: src:tests
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Fail fast on Python syntax and escaped newline errors
        run: |
          python -m compileall -q \
            src/open_intelligence/semantic_contract.py \
            src/open_intelligence/dependency_impact.py \
            src/open_intelligence/h1_semantic_bridge.py \
            src/open_intelligence/h1_question_impact.py \
            apps/api/src/oi_api/source_questions.py \
            apps/api/tests/test_semantic_owner_read.py \
            apps/api/tests/test_canonical_question_flow.py \
            tests/test_semantic_contract.py \
            tests/test_dependency_impact.py \
            tests/test_h1_semantic_bridge.py \
            tests/test_h1_question_impact.py \
            tests/test_semantic_h1_impact_integration.py
      - name: Run dependency-free semantic and lineage regressions
        run: |
          python - <<'PY'
          import sys
          import unittest
          modules = (
              "test_semantic_contract",
              "test_dependency_impact",
              "test_h1_semantic_bridge",
              "test_h1_question_impact",
              "test_semantic_h1_impact_integration",
          )
          loader = unittest.TestLoader()
          suite = unittest.TestSuite(loader.loadTestsFromName(name) for name in modules)
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or not result.testsRun or result.skipped:
              sys.exit(1)
          print(f"Verified {result.testsRun} isolated synthetic semantic tests")
          PY
