name: H1 durable execution (synthetic only)

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'src/open_intelligence/postgres_registry.py'
      - 'src/open_intelligence/patient_registry.py'
      - '.github/workflows/h1-execution.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h1-execution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  durable-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONPATH: apps/api/src:src
      OI_API_ENVIRONMENT: synthetic
      OI_API_DATABASE_URL: postgresql+pg8000://oi_api:oi_h1_synthetic_only@127.0.0.1:5432/oi_api_test_execution
      OI_API_TEST_DATABASE_URL: postgresql+pg8000://oi_api:oi_h1_synthetic_only@127.0.0.1:5432/oi_api_test_execution
      OI_API_RUN_DATABASE_TESTS: '1'
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: oi_api
          POSTGRES_PASSWORD: oi_h1_synthetic_only
          POSTGRES_DB: oi_api_test_execution
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U oi_api -d oi_api_test_execution"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - name: Check out proposed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Select matching PostgreSQL 16 backup clients
        run: |
          test -x /usr/lib/postgresql/16/bin/pg_dump
          test -x /usr/lib/postgresql/16/bin/pg_restore
          test -x /usr/lib/postgresql/16/bin/psql
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Prepare and verify existing runtime
        run: |
          python tools/audit_ci_data_boundaries.py
          python apps/api/tools/prepare_dependencies.py --wheel-dir /tmp/oi-execution-wheels
          python apps/api/tools/check_dependencies.py --wheel-dir /tmp/oi-execution-wheels
          python -m pip install --no-deps --require-hashes --no-index --find-links /tmp/oi-execution-wheels -r apps/api/requirements.lock
      - name: Verify execution and event delivery with real PostgreSQL and no skips
        run: |
          set -o pipefail
          mkdir -p verification-execution
          git rev-parse HEAD > verification-execution/commit.txt
          python - <<'PY' 2>&1 | tee verification-execution/tests.txt
          import sys, unittest
          suite = unittest.TestSuite([
              unittest.defaultTestLoader.discover('apps/api/tests', pattern='test_composer_run*.py'),
              unittest.defaultTestLoader.discover('apps/api/tests', pattern='test_source_event*.py'),
              unittest.defaultTestLoader.discover('apps/api/tests', pattern='test_composer_laboratory_convergence.py'),
          ])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              print('Execution acceptance must not skip:', result.skipped, file=sys.stderr)
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun and not result.skipped else 1)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h1-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-execution/
          if-no-files-found: warn
          retention-days: 7
