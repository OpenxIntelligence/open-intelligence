name: Workspace startup recovery proof
on:
  push:
    branches: [verification/worklist-currentness-20261102]
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      OI_STARTUP_ARTIFACT_DIR: ui-artifacts/startup
      OI_STARTUP_SCENARIOS: initial-failure-connected
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile regression harness
        run: python -m compileall -q tests
      - name: Real browser startup recovery
        run: python tests/workspace_startup_recovery_journey.py
      - name: Record exact source under test
        if: always()
        run: |
          mkdir -p ui-artifacts
          git rev-parse HEAD > ui-artifacts/commit.txt
          git rev-parse 'HEAD^{tree}' | tee ui-artifacts/tree.txt
          sha256sum web/app.js web/index.html web/intake.js web/workspace-entry.js web/workspace-entry.html | tee ui-artifacts/runtime-sha256.txt
          git archive --format=zip --output=ui-artifacts/source-under-test.zip HEAD
      - name: Preserve verification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: startup-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ui-artifacts/
          if-no-files-found: error
          retention-days: 7
