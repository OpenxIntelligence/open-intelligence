name: H1 React patient workspace (fictional only)
on:
  push:
    branches: [feat/h1-react-patient-entry-20261102, integration/h1-react-source-records-20261102, feat/h1-react-record-import-20261102]
  pull_request:
    # The API imports shared src; the browser harness imports tests/browser_journey.py.
    paths: ['apps/web/**', 'apps/api/**', 'src/**', 'tests/**', 'tools/audit_ci_data_boundaries.py', 'tools/verify_checkout.py', 'tools/h1_demo.py', 'examples/synthetic/h1-demo-report.txt', 'examples/synthetic/demo-evidence.txt', '.github/workflows/h1-web.yml']
permissions:
  contents: read
jobs:
  connected-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: oi_api
          POSTGRES_PASSWORD: oi_h1_synthetic_only
          POSTGRES_DB: oi_api_test_web
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U oi_api -d oi_api_test_web"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PYTHONPATH: apps/api/src:src
      OI_API_ENVIRONMENT: synthetic
      OI_API_DATABASE_URL: postgresql+pg8000://oi_api:oi_h1_synthetic_only@127.0.0.1:5432/oi_api_test_web
      OI_WEB_ARTIFACT_DIR: ${{ github.workspace }}/verification-web/screenshots
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify proposed source revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tools/verify_checkout.py --expected-head "$EXPECTED_HEAD"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Record pinned toolchain requirements
        run: |
          node --version
          npm --version
      - name: Check the inherited synthetic-data boundary
        run: python tools/audit_ci_data_boundaries.py
      - name: Acquire candidate packages without lifecycle scripts
        working-directory: apps/web
        run: npm ci --omit=optional --ignore-scripts --no-audit --no-fund
      - name: Inspect dependency declarations and actual notices before build
        working-directory: apps/web
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../../verification-web
          npm run rights 2>&1 | tee ../../verification-web/rights-gate-tests.txt
          npm audit --omit=optional --audit-level=high --json | tee ../../verification-web/audit.json
      - name: Compile client and build actual React UI
        working-directory: apps/web
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../../verification-web
          npm test 2>&1 | tee ../../verification-web/client-tests.txt
          npm run build 2>&1 | tee ../../verification-web/build.txt
      - name: Preserve upstream reviewed backend dependency gate
        run: |
          python apps/api/tools/prepare_dependencies.py --wheel-dir /tmp/oi-h1-wheels
          python apps/api/tools/check_dependencies.py --wheel-dir /tmp/oi-h1-wheels --sbom /tmp/oi-h1-sbom.json
          python -m pip install --force-reinstall --no-deps --no-index --find-links /tmp/oi-h1-wheels --require-hashes -r apps/api/requirements.lock
          python -m pip check
      - name: Actual PostgreSQL API and built React browser journey
        shell: bash
        run: |
          set -o pipefail
          python apps/web/tools/browser_journey.py 2>&1 | tee verification-web/browser.txt
      - name: Persistent fictional demo and complete browser walkthrough
        run: python apps/web/tools/demo_journey.py
      - name: Retain exact code, lock and notices without credentials
        if: always()
        run: |
          mkdir -p verification-web
          git rev-parse HEAD > verification-web/commit.txt
          git archive --format=zip --output=verification-web/source.zip HEAD
          cp apps/web/package-lock.json verification-web/package-lock.json
          if test -d apps/web/.licenses; then cp -r apps/web/.licenses verification-web/licenses; fi
          if test -d apps/web/dist; then cp -r apps/web/dist verification-web/built-ui; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h1-web-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-web/
          if-no-files-found: error
          retention-days: 7
