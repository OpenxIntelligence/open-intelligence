name: PostgreSQL first-party domain contract bake-off (B-01)

on:
  pull_request:
    paths:
      - 'tools/research/postgres_bakeoff/**'
      - 'tests/test_postgres_contract_bakeoff.py'
      - 'tests/test_postgres_registry_bakeoff.py'
      - 'src/open_intelligence/postgres_registry.py'
      - 'src/open_intelligence/patient_registry.py'
      - '.github/workflows/postgres-contract-bakeoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-real-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres_image: ['17.11-bookworm', '18.6-bookworm']
    services:
      postgres:
        # Exact-image digest and its Debian dependency SBOM remain a release gate.
        # Pin to 18.6 for this research run, never use `latest`.
        image: postgres:${{ matrix.postgres_image }}
        env:
          POSTGRES_DB: oi_bakeoff
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-oi-bakeoff-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oi_bakeoff"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      PG_BAKEOFF_REQUIRE: '1'
      PG_BAKEOFF_DSN: postgresql://postgres:local-oi-bakeoff-only@127.0.0.1:5432/oi_bakeoff
      PYTHONPATH: src

    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # approved v4 backport, 2026-07-16
        with:
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install candidate drivers only (no app/runtime adoption)
        run: |
          python -m pip install --disable-pip-version-check 'asyncpg==0.32.0' 'pg8000==1.31.6'
          python -c 'import asyncpg,pg8000; print("asyncpg", asyncpg.__version__); print("pg8000", pg8000.__version__)'
      - name: Run actual PostgreSQL integrity and two-driver checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p b01-artifacts
          python -m compileall -q src/open_intelligence/postgres_registry.py tests/test_postgres_contract_bakeoff.py tests/test_postgres_registry_bakeoff.py
          python -m unittest discover -s tests -p 'test_postgres_*_bakeoff.py' -v 2>&1 | tee b01-artifacts/tests.txt
          # Fail closed if a missing Postgres connection or driver skipped a test.
          if grep -Eiq 'skipped|OK \(skipped=' b01-artifacts/tests.txt; then
            echo 'B-01 ERROR: integration tests skipped despite PG_BAKEOFF_REQUIRE=1' >&2
            exit 1
          fi
      - name: Capture dependency and database receipts
        if: always()
        shell: bash
        run: |
          mkdir -p b01-artifacts
          python -m pip freeze > b01-artifacts/resolved-pip-packages.txt
          git rev-parse HEAD > b01-artifacts/checkout-sha.txt
          git rev-parse --verify HEAD:tools/research/postgres_bakeoff/001_contract.sql > b01-artifacts/sql-blob-sha.txt
          docker image inspect postgres:${{ matrix.postgres_image }} --format '{{json .RepoDigests}}' > b01-artifacts/server-image-digests.json || true
          printf '%s\n' 'PostgreSQL ${{ matrix.postgres_image }} research image. No runtime release or transitive-license clearance.' > b01-artifacts/scope.txt
      - name: Preserve original deterministic test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oi-b01-postgres-${{ matrix.postgres_image }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: b01-artifacts/
          if-no-files-found: error
          retention-days: 7
