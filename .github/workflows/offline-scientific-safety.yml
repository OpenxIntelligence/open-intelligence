name: Offline scientific safety regression

on:
  pull_request:
    branches:
      - main
      - safety/no-personal-case-data-in-ci-20261102
    paths:
      - 'tools/research/rna_expression_probe.py'
      - 'tools/research/single_cell_probe.py'
      - 'tools/research/test_restricted_research_entrypoints.py'
      - '.github/workflows/offline-scientific-safety.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile archived parsing utilities
        run: python -m compileall -q tools/research
      - name: Verify prohibited research entrypoints cannot perform IO
        env:
          PYTHONPATH: tools/research
        run: python -m unittest discover -s tools/research -p 'test_restricted_research_entrypoints.py' -v
      - name: Verify independent fictional RNA parser regressions
        env:
          PYTHONPATH: tools/research
        run: python -m unittest discover -s tools/research -p 'test_rna_expression_probe.py' -v
      - name: Verify independent fictional single-cell statistics
        env:
          PYTHONPATH: tools/research
        run: python -m unittest discover -s tools/research -p 'test_single_cell_probe.py' -v
