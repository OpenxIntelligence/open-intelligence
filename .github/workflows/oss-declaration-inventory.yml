name: OSS dependency declaration inventory

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  declare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Static audit tests (no network or package installs)
        run: python -m unittest discover -s tests -p test_oss_dependency_inventory.py -v
      - name: Inventory the exact checked-out dependency declarations
        run: |
          mkdir -p verification-artifacts
          git rev-parse HEAD > verification-artifacts/source-head.txt
          python tools/oss_dependency_inventory.py --output verification-artifacts/oss-declarations.json
      - name: Preserve declaration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oss-declaration-inventory-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-artifacts/
          retention-days: 14
          if-no-files-found: error
