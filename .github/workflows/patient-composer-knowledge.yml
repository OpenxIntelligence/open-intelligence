name: First-party patient Composer knowledge integration

on:
  push:
    branches: [integration/patient-composer-knowledge-20261102]
  pull_request:
    branches: [integration/clinical-composer-authorized-read-20261102]

permissions:
  contents: read

jobs:
  knowledge-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact integration revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install the exact inherited PDF extraction dependency
        run: |
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements-pdf.lock
      - name: Verify syntax
        run: PYTHONPATH=src python -m compileall -q src tests
      - name: Actual clinical rights-aware Composer integration suite
        run: PYTHONPATH=src python -m unittest discover -s tests -p test_patient_clinical_knowledge_integration.py -v
      - name: Original upstream knowledge rights suite
        run: PYTHONPATH=src python -m unittest discover -s tests -p test_knowledge_context.py -v
      - name: Source owner and clinical continuity regressions
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -p test_clinical_composer_authority.py -v
          PYTHONPATH=src python -m unittest discover -s tests -p test_clinical_continuity.py -v
      - name: All repository Python and HTTP tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
