name: Connected original intake verification
on:
  push:
    branches: [work/connected-intake-composition-20261103]
  pull_request:
    branches: [integration/connected-patient-workflow-41558360041-1]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      candidate: ${{ steps.candidate.outputs.sha }}
      tree: ${{ steps.candidate.outputs.tree }}
    env:
      PYTHONPATH: src:tests:.
      OI_UI_ARTIFACT_DIR: verification-artifacts
      OI_INTAKE_ARTIFACT_DIR: verification-artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Reproduce pinned source and reviewed repairs
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          python tools/compose_connected_intake.py
          git add -A -- . ':!verification-artifacts'
          TREE=$(git write-tree)
          export GIT_AUTHOR_NAME='Open Intelligence integration'
          export GIT_AUTHOR_EMAIL='open-intelligence@outlook.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          CANDIDATE=$(printf '%s\n' 'Connect inspected original intake to patient reports and follow-through' | git commit-tree "$TREE" -p HEAD -p f9ba8d66b56a7d6669ef0ffce902af6565e1b477)
          git checkout --detach "$CANDIDATE"
          git update-ref refs/heads/connected-intake-candidate "$CANDIDATE"
      - name: Record exact candidate
        id: candidate
        run: |
          mkdir -p verification-artifacts
          git rev-parse HEAD | tee verification-artifacts/commit.txt
          git rev-parse HEAD^{tree} | tee verification-artifacts/tree.txt
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          git archive --format=zip --output=verification-artifacts/source-under-test.zip HEAD
      - name: Compile and complete JavaScript suites
        run: |
          set -euo pipefail
          python -m compileall -q src tests tools
          for file in web/*.js; do node --check "$file"; done
          node --test tests/test_*.js 2>&1 | tee verification-artifacts/javascript.txt
      - name: Complete Python and HTTP suite
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee verification-artifacts/python.txt
      - name: Connected empty-workspace file to report journey
        run: |
          set -euo pipefail
          python tests/clinical_workspace_browser_journey.py 2>&1 | tee verification-artifacts/connected-intake-browser.txt
      - name: All six original browser journeys
        run: |
          set -euo pipefail
          for journey in browser_patient_record patient_report_followthrough_browser_journey browser_journey browser_source_dialogs ui_glance_journey patient_mission_browser_journey; do
            python "tests/$journey.py" 2>&1 | tee "verification-artifacts/$journey.txt"
          done
      - name: Bundle verified candidate
        if: github.event_name == 'push'
        run: |
          git bundle create verification-artifacts/candidate.bundle refs/heads/connected-intake-candidate ^9735414c947c211ab20154638179d0be8ff2db32 ^f9ba8d66b56a7d6669ef0ffce902af6565e1b477
          git bundle verify verification-artifacts/candidate.bundle
      - name: Preserve inspectable synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connected-intake-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-artifacts/
          retention-days: 7
          if-no-files-found: error
  publish-isolated-candidate:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/work/connected-intake-composition-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Publish tested source to a new branch only
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_SHA: ${{ needs.verify.outputs.candidate }}
          EXPECTED_TREE: ${{ needs.verify.outputs.tree }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$REPOSITORY" --name "connected-intake-$RUN_ID-$ATTEMPT" --dir candidate-artifact
          git bundle verify candidate-artifact/candidate.bundle
          git fetch candidate-artifact/candidate.bundle refs/heads/connected-intake-candidate
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse FETCH_HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(cat candidate-artifact/commit.txt)" = "$EXPECTED_SHA"
          test "$(cat candidate-artifact/tree.txt)" = "$EXPECTED_TREE"
          BRANCH="integration/connected-intake-$RUN_ID-$ATTEMPT"
          git push --force-with-lease="refs/heads/$BRANCH:" origin "$EXPECTED_SHA:refs/heads/$BRANCH"
          printf 'New isolated candidate: %s at %s (tree %s)\n' "$BRANCH" "$EXPECTED_SHA" "$EXPECTED_TREE" | tee -a "$GITHUB_STEP_SUMMARY"
