name: Synthetic case ledger tests
on:
  push:
    branches: [main, feat/synthetic-case-ledger, feat/versioned-evidence-assessment]
  pull_request:
    branches: [main, feat/synthetic-case-ledger]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile
        run: PYTHONPATH=src python -m compileall -q src
      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/mission.js
      - name: Characterize synthetic adapter limits (not release authorization)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p verification-artifacts
          PYTHONPATH=src python tests/test_whole_patient_continuity.py --boundary-probe | tee verification-artifacts/whole-patient-boundary.json
      - name: Unit and HTTP tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p verification-artifacts
          PYTHONPATH=src python -m unittest discover -s tests -v 2>&1 | tee verification-artifacts/unit-tests.txt
      - name: Synthetic browser journey (headless Chromium)
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=src python tests/browser_journey.py 2>&1 | tee verification-artifacts/browser-tests.txt
      - name: Patient Mission browser journey (headless Chromium)
        run: PYTHONPATH=src python tests/patient_mission_browser_journey.py
      - name: Record exact synthetic source under test
        if: always()
        run: |
          mkdir -p verification-artifacts
          git rev-parse HEAD > verification-artifacts/commit.txt
          git archive --format=zip --output=verification-artifacts/source-under-test.zip HEAD
      - name: Preserve reproducible engineering evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-ledger-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-artifacts/
          if-no-files-found: error
          retention-days: 7

  identity-continuity-integration:
    # Review-only composition. It does not merge a PR or update a remote ref.
    if: github.event_name == 'pull_request' && github.head_ref == 'research/whole-patient-continuity'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MAIN_COMMIT: 52ea683fbe3537b17a05066dceff2ba01f758c5d
      QUALIFIED_IDENTITY_COMMIT: 5e427515f88f2fcb714474d10ec51bac2ea7964a
      DURABLE_IDENTITY_COMMIT: c2efe398728aab2482f3eab4a26db3139bc2e7c4
      CONTINUITY_COMMIT: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout pinned main (preserve current data-retrieval restrictions)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 52ea683fbe3537b17a05066dceff2ba01f758c5d
          fetch-depth: 0
          persist-credentials: false
      - name: Compose immutable review candidates without publishing a merge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oi-identity-continuity"
          test "$(git rev-parse HEAD)" = "$MAIN_COMMIT"
          git fetch --no-tags origin "$QUALIFIED_IDENTITY_COMMIT" "$DURABLE_IDENTITY_COMMIT" "$CONTINUITY_COMMIT"
          git merge-base --is-ancestor "$QUALIFIED_IDENTITY_COMMIT" "$DURABLE_IDENTITY_COMMIT"
          git config user.name "Open Intelligence CI verification"
          git config user.email "verification@example.invalid"
          git merge --no-ff --no-commit "$DURABLE_IDENTITY_COMMIT" "$CONTINUITY_COMMIT"
          test -z "$(git ls-files --unmerged)"
          # Keep the upstream identity patch byte-exact; disclose its existing
          # whitespace warning while still gating every file changed here.
          if ! git diff --cached --check > "$RUNNER_TEMP/oi-identity-continuity/upstream-whitespace.txt" 2>&1; then
            echo "::warning::Composed upstream patch has whitespace warnings; see retained receipt"
          fi
          git diff --cached --check -- .github/workflows/synthetic-tests.yml validation/identity_continuity_gate.py tests/test_whole_patient_continuity.py
          TREE=$(git write-tree)
          export TREE
          git archive --format=zip --output="$RUNNER_TEMP/oi-identity-continuity/source-under-test.zip" "$TREE"
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'oi-identity-continuity'
          filenames = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          fingerprints = {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()
                          for p in filenames if p and pathlib.Path(p).is_file()}
          receipt = {
              'main_commit': os.environ['MAIN_COMMIT'],
              'qualified_identity_commit': os.environ['QUALIFIED_IDENTITY_COMMIT'],
              'durable_identity_commit': os.environ['DURABLE_IDENTITY_COMMIT'],
              'continuity_commit': os.environ['CONTINUITY_COMMIT'],
              'composed_tree': os.environ['TREE'],
              'data': 'original-fictional-fixtures-only',
              'remote_ref_changed': False,
              'release_authorized': False,
              'clinical_validation_performed': False,
              'source_zip_sha256': hashlib.sha256((output / 'source-under-test.zip').read_bytes()).hexdigest(),
          }
          (output / 'composition.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          (output / 'source-fingerprints.json').write_text(json.dumps(fingerprints, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Compile and check original JavaScript
        run: |
          PYTHONPATH=src python -m compileall -q src tests validation/identity_continuity_gate.py
          node --check web/app.js
          node --check web/mission.js
      - name: Combined unit and HTTP suite
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=src python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/oi-identity-continuity/unit-tests.txt"
      - name: Strict cross-process scope race and rollback gate
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=src python validation/identity_continuity_gate.py -v 2>&1 | tee "$RUNNER_TEMP/oi-identity-continuity/strict-boundary-tests.txt"
      - name: Record descriptive observations separately from the strict gate
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=src python tests/test_whole_patient_continuity.py --boundary-probe | tee "$RUNNER_TEMP/oi-identity-continuity/boundary-observations.json"
      - name: Existing synthetic browser journeys on composed source
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=src python tests/browser_journey.py 2>&1 | tee "$RUNNER_TEMP/oi-identity-continuity/browser-tests.txt"
          PYTHONPATH=src python tests/patient_mission_browser_journey.py 2>&1 | tee "$RUNNER_TEMP/oi-identity-continuity/mission-browser-tests.txt"
      - name: Preserve exact composition and all verification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: identity-continuity-composition-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oi-identity-continuity/
          if-no-files-found: error
          retention-days: 7
