name: Synthetic case ledger tests
on:
  push:
    branches: [main, feat/synthetic-case-ledger, feat/versioned-evidence-assessment]
  pull_request:
    branches: [main, feat/synthetic-case-ledger]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile
        run: PYTHONPATH=src python -m compileall -q src
      - name: JavaScript syntax
        run: node --check web/app.js
      - name: Source inspection concurrency and identity
        run: node --test tests/test_source_dialogs.js
      - name: Unit and HTTP tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Synthetic browser journey (headless Chromium)
        run: PYTHONPATH=src python tests/browser_journey.py
      - name: Source dialog browser event regression
        run: PYTHONPATH=src python tests/browser_source_dialogs.py
