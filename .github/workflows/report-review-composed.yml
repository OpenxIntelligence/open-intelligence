name: Composed report to existing review receipt
on:
  pull_request:
    branches: [feat/permission-scoped-evidence-report-20261102, main]
    paths:
      - 'validation/report_review/**'
      - 'tools/compose_report_review.py'
      - '.github/workflows/report-review-composed.yml'
      - 'docs/superpowers/plans/2026-11-02-report-review-receipt-binding.md'
  push:
    branches: [integration/report-review-receipt-binding-20261102]
permissions:
  contents: read
jobs:
  composed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src:tests:.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Stage pinned source-owner integration without remote changes
        run: python tools/compose_report_review.py
      - name: Compile and execute focused original-module checks
        shell: bash
        run: |
          set -o pipefail
          python -m compileall -q src tests
          node --check web/app.js
          node --check web/mission.js
          python -m unittest discover -s tests -p test_report_review_handoff.py -v 2>&1 | tee verification-report-handoff/new-tests.txt
          python -m unittest discover -s tests -p test_authorized_evidence_review_handoff.py -v 2>&1 | tee verification-report-handoff/review-owner-tests.txt
          python -m unittest discover -s tests -p test_evidence_review_report.py -v 2>&1 | tee verification-report-handoff/report-owner-tests.txt
      - name: Complete synthetic application regression
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee verification-report-handoff/full-tests.txt
      - name: Existing source and patient browser regression
        shell: bash
        run: |
          set -o pipefail
          python tests/browser_journey.py 2>&1 | tee verification-report-handoff/browser-tests.txt
          python tests/patient_mission_browser_journey.py 2>&1 | tee verification-report-handoff/patient-browser-tests.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: report-review-composed-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-report-handoff/
          if-no-files-found: error
          retention-days: 7
