name: Workspace loopback and cross-origin boundary regression
on:
  push:
    branches: [test/workspace-loopback-boundaries-20261102]
  pull_request:
    branches: [integration/clinical-workspace-entry-20261102]
permissions:
  contents: read
jobs:
  access-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Compile
        run: PYTHONPATH=src python -m compileall -q src tests
      - name: Host and origin denial regressions
        run: PYTHONPATH=src:tests:. python -m unittest discover -s tests -p 'test_workspace_loopback_boundaries.py' -v
      - name: Original workspace HTTP contracts
        run: PYTHONPATH=src:tests:. python -m unittest discover -s tests -p 'test_workspace_start_http.py' -v
      - name: Existing synthetic Python and HTTP suite
        run: PYTHONPATH=src:tests:. python -m unittest discover -s tests -v
