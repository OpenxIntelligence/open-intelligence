name: Verify integrated record acquisition before isolated publication
on:
  push:
    branches: [verify/h1-record-acquisition-20261103]
permissions:
  contents: read
concurrency:
  group: verify-record-acquisition-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: oi_api
          POSTGRES_PASSWORD: oi_h1_synthetic_only
          POSTGRES_DB: oi_api_test_acquisition
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U oi_api -d oi_api_test_acquisition"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PYTHONPATH: apps/api/src:src
      OI_API_ENVIRONMENT: synthetic
      OI_API_DATABASE_URL: postgresql+pg8000://oi_api:oi_h1_synthetic_only@127.0.0.1:5432/oi_api_test_acquisition
      OI_API_TEST_DATABASE_URL: postgresql+pg8000://oi_api:oi_h1_synthetic_only@127.0.0.1:5432/oi_api_test_acquisition
      OI_API_RUN_DATABASE_TESTS: '1'
      OI_WEB_ARTIFACT_DIR: ${{ github.workspace }}/verification-web/screenshots
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Reconstruct and verify exact app-only source tree
        run: python3 .github/acquisition-verification/prepare.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Keep existing synthetic data and dependency boundaries
        run: |
          python tools/audit_ci_data_boundaries.py
          python -m pip download --require-hashes --only-binary=:all: --dest /tmp/oi-h1-wheels -r apps/api/requirements.lock
          python apps/api/tools/check_dependencies.py --wheel-dir /tmp/oi-h1-wheels --sbom /tmp/oi-h1-sbom.json
          python -m pip install --no-index --find-links /tmp/oi-h1-wheels --require-hashes -r apps/api/requirements.lock
          python -m pip check
      - name: Build and test the actual locked React application
        working-directory: apps/web
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../../verification-web
          node --version
          npm ci --omit=optional --ignore-scripts --no-audit --no-fund
          npm run rights
          npm audit --omit=optional --audit-level=high --json | tee ../../verification-web/audit.json
          npm test 2>&1 | tee ../../verification-web/client-tests.txt
          npm run build 2>&1 | tee ../../verification-web/build.txt
      - name: Run complete actual PostgreSQL API acceptance without skips
        shell: bash
        run: |
          set -o pipefail
          mkdir -p verification-web
          python -m oi_api.migrate upgrade head
          python - <<'PY' 2>&1 | tee verification-web/api-tests.txt
          import sys, unittest
          result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('apps/api/tests'))
          if result.skipped: print('Unexpected skipped acceptance:',result.skipped,file=sys.stderr)
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun and not result.skipped else 1)
          PY
      - name: Preserve complete reference application regression
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=src python -m unittest discover -s tests -v 2>&1 | tee verification-web/reference-tests.txt
      - name: Real Chromium to FastAPI to PostgreSQL connected workflow
        shell: bash
        run: |
          set -o pipefail
          python apps/web/tools/browser_journey.py 2>&1 | tee verification-web/browser.txt
      - name: Retain exact source, outputs and dependency evidence without credentials
        if: always()
        run: |
          mkdir -p verification-web
          git rev-parse HEAD > verification-web/commit.txt
          git rev-parse HEAD^{tree} > verification-web/tree.txt
          git archive --format=zip --output=verification-web/source.zip HEAD
          cp apps/web/package-lock.json verification-web/package-lock.json
          if test -f /tmp/oi-h1-sbom.json; then cp /tmp/oi-h1-sbom.json verification-web/backend-sbom.json; fi
          if test -d apps/web/.licenses; then cp -r apps/web/.licenses verification-web/licenses; fi
          if test -d apps/web/dist; then cp -r apps/web/dist verification-web/built-ui; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: h1-record-acquisition-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-web/
          if-no-files-found: error
          retention-days: 7
  publish-tested-candidate:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Independently reconstruct the verified immutable source
        run: python3 .github/acquisition-verification/prepare.py
      - name: Publish only a new app-only branch, never main or an owner branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = '8b70e69b6fa6dd5fdc6276effdd0fce1c05a81ab'
          test "$(git rev-parse HEAD^{tree})" = '21b2d594c82042fceaa564c041e401b52e1e60d4'
          git -c 'credential.helper=!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' push --force-with-lease=refs/heads/feat/h1-record-acquisition-workspace-20261103: origin HEAD:refs/heads/feat/h1-record-acquisition-workspace-20261103
