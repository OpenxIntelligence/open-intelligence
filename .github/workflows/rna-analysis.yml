name: RNA parser regression — synthetic fixtures only
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/research/rna_expression_probe.py'
      - 'tools/research/test_rna_expression_probe.py'
      - 'tools/research/test_sid_case_data_disabled.py'
      - '.github/workflows/rna-analysis.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Unit tests with original fictional parser fixtures only
        run: python -m unittest discover -s tools/research -p 'test_rna_expression_probe.py' -v
      - name: Verify Sid dataset network acquisition is denied
        run: python -m unittest discover -s tools/research -p 'test_sid_case_data_disabled.py' -v
