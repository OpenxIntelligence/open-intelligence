name: RNA research archive (fictional unit tests only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/research/rna_expression_probe.py'
      - 'tools/research/test_rna_expression_probe.py'
      - '.github/workflows/rna-analysis.yml'

permissions:
  contents: read

jobs:
  offline-rna:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Enforce patient-data-independent CI
        run: python tools/audit_ci_data_boundaries.py
      - name: Run independently authored fictional numerical regression tests
        run: python -m unittest discover -s tools/research -p test_rna_expression_probe.py -v
      # Only generic offline helpers remain; legacy acquisition fails closed.
      # Historical case-specific implementation is available in version history.
