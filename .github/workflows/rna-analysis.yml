name: Bounded molecular analysis
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rna-analysis.yml'
      - 'tools/research/rna_expression_probe.py'
      - 'tools/research/test_rna_expression_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  molecular:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Inspect selected processed RNA schemas without publishing biological values
        shell: bash
        run: |
          mkdir -p molecular-results
          python - <<'PY'
          import hashlib,json,urllib.request,urllib.parse,xml.etree.ElementTree as ET
          from pathlib import Path
          from datetime import datetime,timezone
          base='https://sid-sijbrandij-osteosarc-dataset.s3.us-west-2.amazonaws.com/'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):
                  raise ValueError('Redirect refused')
          op=urllib.request.build_opener(NoRedirect())
          def get(url,limit=2_000_000):
              if not url.startswith(base): raise ValueError('Wrong endpoint')
              with op.open(urllib.request.Request(url,headers={'User-Agent':'OpenIntelligence-bounded-RNA-research/1'}),timeout=40) as r:
                  raw=r.read(limit+1)
              if len(raw)>limit: raise ValueError('Size cap')
              return raw
          result={'purpose':'Read method and actual file schemas before quantitative analysis; no biological rows exported','at':datetime.now(timezone.utc).isoformat(),'folders':{}}
          try:
              raw=get(base+'rna-seq/reprocessed/README.md',30000)
              result['method_readme']={'text':raw.decode(),'sha256':hashlib.sha256(raw).hexdigest()}
              for sample in ['BG003082','P116686_3','BG009368','SARC0277_T1','SARC0277']:
                  prefix='rna-seq/reprocessed/'+sample+'/'
                  raw=get(base+'?'+urllib.parse.urlencode({'list-type':'2','prefix':prefix,'max-keys':150}))
                  tree=ET.fromstring(raw);ns={'s':'http://s3.amazonaws.com/doc/2006-03-01/'}
                  rows=[{'key':e.findtext('s:Key',namespaces=ns),'bytes':int(e.findtext('s:Size',namespaces=ns))} for e in tree.findall('s:Contents',ns)]
                  for row in rows:
                      k=row['key']
                      if k.endswith(('.genes.results','.gene_tpm.gct','.gene_reads.gct','.tsv','.csv','.txt')) and row['bytes']<15_000_000:
                          b=get(base+urllib.parse.quote(k,safe='/'),15_000_000)
                          lines=b.decode('utf-8').splitlines()
                          row['sha256']=hashlib.sha256(b).hexdigest();row['lines']=len(lines)
                          row['header_only']=lines[:3] if k.endswith('.gct') else lines[:1]
                  result['folders'][sample]={'truncated':tree.findtext('s:IsTruncated',namespaces=ns),'files':rows}
              result['status']='inspected'
          except Exception as exc:
              result['status']='failed';result['error_type']=type(exc).__name__;result['error']=str(exc)
          Path('molecular-results/discovery.json').write_text(json.dumps(result,indent=2))
          print(result['status'])
          if result['status']!='inspected': raise SystemExit(1)
          PY
      - name: Retain schema inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: molecular-analysis-evidence
          path: molecular-results/*.json
          retention-days: 30
          if-no-files-found: error
