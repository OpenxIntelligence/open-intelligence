name: RNA research archive (fictional unit tests only)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tools/research/rna_expression_probe.py'
      - 'tools/research/test_rna_expression_probe.py'
      - 'tools/research/test_sid_case_data_disabled.py'
      - '.github/workflows/rna-analysis.yml'
      - 'tools/verify_offline_research.py'

permissions:
  contents: read

jobs:
  offline-rna:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Enforce patient-data-independent CI
        run: python tools/audit_ci_data_boundaries.py
      - name: Run independently authored fictional numerical regression tests
        run: python tools/verify_offline_research.py . tools/research test_rna_expression_probe.py
      - name: Verify retired patient-data entrypoints fail before networking
        run: python tools/verify_offline_research.py . tools/research test_sid_case_data_disabled.py
      # Archived network-dependent investigation is NOT invoked, even manually.
      # Its original exploratory code is retained for separately governed review.
