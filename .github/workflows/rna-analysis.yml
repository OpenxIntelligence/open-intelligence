name: Bounded molecular analysis
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rna-analysis.yml'
      - 'tools/research/rna_expression_probe.py'
      - 'tools/research/test_rna_expression_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  molecular:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Complete research regression suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p molecular-results
          python -m unittest discover -s tools/research -p 'test_*.py' -v 2>&1 | tee molecular-results/tests.txt
      - name: Execute fixed-scope five-library RNA investigation
        run: python tools/research/rna_expression_probe.py --output molecular-results/analysis.json
      - name: Preserve source receipt
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          paths=[Path('tools/research/rna_expression_probe.py'),Path('tools/research/test_rna_expression_probe.py'),Path('tools/research/public_case_intake.py'),Path('.github/workflows/rna-analysis.yml')]
          d={'checkout':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths},'raw_matrices_published':False,'clinical_validation':False}
          Path('molecular-results').mkdir(exist_ok=True)
          Path('molecular-results/receipt.json').write_text(json.dumps(d,indent=2))
          PY
      - name: Retain bounded derived findings and original code, not full patient matrices
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: molecular-analysis-evidence
          path: |
            molecular-results/*.json
            molecular-results/tests.txt
            tools/research/*.py
            .github/workflows/rna-analysis.yml
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
