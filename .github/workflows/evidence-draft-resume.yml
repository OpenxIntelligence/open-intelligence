name: Resume preserved H1 evidence draft (isolated verification)
on:
  push:
    branches: [work/h1-evidence-draft-verification-20261103]
    paths: ['tools/evidence-draft-resume.patch.b64']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      candidate: ${{ steps.candidate.outputs.sha }}
      tree: ${{ steps.candidate.outputs.tree }}
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: oi_api
          POSTGRES_PASSWORD: oi_h1_synthetic_only
          POSTGRES_DB: oi_api_test_resume
        ports: ['127.0.0.1:5432:5432']
        options: >-
          --health-cmd "pg_isready -U oi_api -d oi_api_test_resume"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PYTHONPATH: apps/api/src:src
      OI_API_ENVIRONMENT: synthetic
      OI_API_DATABASE_URL: postgresql+pg8000://oi_api:oi_h1_synthetic_only@127.0.0.1:5432/oi_api_test_resume
      OI_API_TEST_DATABASE_URL: postgresql+pg8000://oi_api:oi_h1_synthetic_only@127.0.0.1:5432/oi_api_test_resume
      OI_API_CONNECT_TIMEOUT_SECONDS: '2'
      OI_API_RUN_DATABASE_TESTS: '1'
      OI_WEB_ARTIFACT_DIR: ${{ github.workspace }}/verification-resume/screenshots
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      COMPOSE_PROJECT_NAME: oi-draft-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.16'
      - name: Reconstruct only the exact saved candidate tree
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          packed = Path('tools/evidence-draft-resume.patch.b64').read_bytes()
          assert len(packed) <= 24000
          patch = gzip.decompress(base64.b64decode(packed, validate=False))
          assert len(patch) == 60058
          assert hashlib.sha256(patch).hexdigest() == '20a9ddc9a6a15f74819aced7107a5d51867d106b81df1e06a07c19ffa2604838'
          Path('/tmp/oi-preserved-draft.patch').write_bytes(patch)
          PY
          BASE=818c67fcb742941fe1588c4ee130ce07e15a814d
          test "$(git rev-parse "$BASE^{tree}")" = 39b897a67da9a212e466c9ff7caf6241a219c980
          git checkout --detach "$BASE"
          git apply --check /tmp/oi-preserved-draft.patch
          git apply --index /tmp/oi-preserved-draft.patch
          TREE=$(git write-tree)
          test "$TREE" = 8d6e35e8dbc1a75d525f72fcec8a1279d96b327d
          export GIT_AUTHOR_NAME='Open Intelligence'
          export GIT_AUTHOR_EMAIL='open-intelligence@outlook.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          SHA=$(printf '%s\n' 'Preserve scoped unfinished evidence comparisons across refresh and navigation' | git commit-tree "$TREE" -p "$BASE")
          git checkout --detach "$SHA"
          git update-ref refs/heads/evidence-draft-candidate "$SHA"
          mkdir -p verification-resume
          printf '%s\n' "$SHA" > verification-resume/commit.txt
          printf '%s\n' "$TREE" > verification-resume/tree.txt
          git diff --stat "$BASE" HEAD > verification-resume/diff-stat.txt
          git archive --format=zip --output=verification-resume/source.zip HEAD
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tree=$TREE" >> "$GITHUB_OUTPUT"
      - name: Install unchanged frontend lock without lifecycle scripts
        working-directory: apps/web
        run: npm ci --omit=optional --ignore-scripts --no-audit --no-fund
      - name: Existing frontend notices, client tests and production build
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          node tools/license-gate.mjs
          npm audit --omit=optional --audit-level=high --json | tee ../../verification-resume/audit.json
          npm test 2>&1 | tee ../../verification-resume/client.txt
          npm run build 2>&1 | tee ../../verification-resume/build.txt
          cp -r .licenses ../../verification-resume/licenses
      - name: Existing backend wheel and notice gate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip download --require-hashes --only-binary=:all: --dest /tmp/oi-resume-wheels -r apps/api/requirements.lock
          python apps/api/tools/check_dependencies.py --wheel-dir /tmp/oi-resume-wheels --sbom verification-resume/backend-sbom.json
          python -m pip install --no-index --find-links /tmp/oi-resume-wheels --require-hashes -r apps/api/requirements.lock
          python -m pip check
          python tools/audit_ci_data_boundaries.py
      - name: Full existing API and PostgreSQL acceptance, no skipped cases
        shell: bash
        run: |
          set -euo pipefail
          python -m oi_api.migrate upgrade head
          python - <<'PY' 2>&1 | tee verification-resume/api.txt
          import sys, unittest
          suite = unittest.defaultTestLoader.discover('apps/api/tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              print('Skipped database acceptance is not a pass:', result.skipped, file=sys.stderr)
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun and not result.skipped else 1)
          PY
      - name: Full retained reference suite
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v 2>&1 | tee verification-resume/reference.txt
      - name: Actual built React, FastAPI and PostgreSQL browser workflow
        shell: bash
        run: |
          set -euo pipefail
          python apps/web/tools/browser_journey.py 2>&1 | tee verification-resume/browser.txt
      - name: Retained reference browser workflows
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python tests/browser_journey.py 2>&1 | tee verification-resume/reference-browser.txt
          python tests/patient_mission_browser_journey.py 2>&1 | tee verification-resume/mission-browser.txt
      - name: Retained actual container restart and restore gates
        shell: bash
        env:
          OI_EVIDENCE_ACCEPTANCE_FILE: verification-resume/evidence-recovery.json
        run: |
          set -euo pipefail
          for probe in registry sources reviews evidence; do
            python "apps/api/tools/verify_${probe}_compose.py" 2>&1 | tee "verification-resume/recovery-${probe}.txt"
          done
      - name: Preserve exact verified commit for create-only publication
        run: |
          git bundle create verification-resume/candidate.bundle refs/heads/evidence-draft-candidate ^818c67fcb742941fe1588c4ee130ce07e15a814d
          git bundle verify verification-resume/candidate.bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: evidence-draft-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-resume/
          if-no-files-found: error
          retention-days: 7
  publish-new-review-branch:
    needs: verify
    if: github.ref == 'refs/heads/work/h1-evidence-draft-verification-20261103'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 818c67fcb742941fe1588c4ee130ce07e15a814d
          fetch-depth: 0
      - name: Publish only the tested tree to a new branch, never main or parent
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.verify.outputs.candidate }}
          EXPECTED_TREE: ${{ needs.verify.outputs.tree }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$REPOSITORY" --name "evidence-draft-$RUN_ID-$ATTEMPT" --dir inspected-candidate
          git bundle verify inspected-candidate/candidate.bundle
          git fetch inspected-candidate/candidate.bundle refs/heads/evidence-draft-candidate
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse FETCH_HEAD^{tree})" = "$EXPECTED_TREE"
          test "$EXPECTED_TREE" = 8d6e35e8dbc1a75d525f72fcec8a1279d96b327d
          test "$(cat inspected-candidate/commit.txt)" = "$EXPECTED_SHA"
          BRANCH="feat/h1-evidence-draft-$RUN_ID-$ATTEMPT"
          git push --force-with-lease="refs/heads/$BRANCH:" origin "$EXPECTED_SHA:refs/heads/$BRANCH"
          printf 'Verified candidate %s at %s; tree %s\n' "$BRANCH" "$EXPECTED_SHA" "$EXPECTED_TREE" >> "$GITHUB_STEP_SUMMARY"
