name: Connected PDF source and report verification
on:
  push:
    branches: [work/pdf-connected-composition-20261103]
  pull_request:
    branches: [integration/connected-intake-41564590960-1]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      candidate: ${{ steps.candidate.outputs.sha }}
      tree: ${{ steps.candidate.outputs.tree }}
    env:
      PYTHONPATH: src:tests:.
      PYTHONUNBUFFERED: '1'
      OI_UI_ARTIFACT_DIR: verification-artifacts
      OI_INTAKE_ARTIFACT_DIR: verification-artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Reproduce inspected source composition
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          python tools/compose_pdf_connected.py
          git add -A -- . ':!verification-artifacts' ':!composer-broker-artifacts'
          TREE=$(git write-tree)
          export GIT_AUTHOR_NAME='Open Intelligence integration'
          export GIT_AUTHOR_EMAIL='open-intelligence@outlook.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          CANDIDATE=$(printf '%s\n' 'Connect original PDF records to governed reports and follow-through' | git commit-tree "$TREE" -p HEAD -p 3be1106b5cd34523c4746e2df6f123048beb5659)
          git checkout --detach "$CANDIDATE"
          git update-ref refs/heads/pdf-connected-candidate "$CANDIDATE"
      - name: Record exact candidate
        id: candidate
        run: |
          mkdir -p verification-artifacts
          git rev-parse HEAD | tee verification-artifacts/commit.txt
          git rev-parse HEAD^{tree} | tee verification-artifacts/tree.txt
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          git archive --format=zip --output=verification-artifacts/source-under-test.zip HEAD
      - name: Install unchanged exact source-owned PDF dependency
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --only-binary=:all: --no-deps -r requirements-pdf.lock
          python -c "import pypdf; print(pypdf.__version__); assert pypdf.__version__ == '6.21.4'" | tee verification-artifacts/pdf-runtime.txt
      - name: Data guard, compile and all JavaScript tests
        run: |
          set -euo pipefail
          python tools/audit_ci_data_boundaries.py | tee verification-artifacts/data-guard.txt
          python -m compileall -q src tests tools
          for file in web/*.js; do node --check "$file"; done
          node --test tests/test_*.js 2>&1 | tee verification-artifacts/javascript.txt
      - name: Full Python domain, PDF and HTTP suite
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee verification-artifacts/python.txt
      - name: Retained offline research boundaries
        run: |
          set -euo pipefail
          PYTHONPATH=src:tools/research python -m unittest test_restricted_research_entrypoints test_rna_expression_probe test_single_cell_probe test_public_case_intake -v 2>&1 | tee verification-artifacts/offline-research.txt
      - name: Extended PDF source-to-review-to-task journey
        run: |
          set -euo pipefail
          python tests/document_intake_browser_journey.py 2>&1 | tee verification-artifacts/document-browser.txt
      - name: Retained connected, source and Composer browser journeys
        run: |
          set -euo pipefail
          for journey in clinical_workspace_browser_journey browser_patient_record patient_report_followthrough_browser_journey browser_journey browser_source_dialogs ui_glance_journey patient_mission_browser_journey composer_browser_journey composer_lab_browser_journey composer_durable_browser_journey composer_broker_browser_journey; do
            python "tests/$journey.py" 2>&1 | tee "verification-artifacts/$journey.txt"
          done
      - name: Bundle verified candidate
        if: github.event_name == 'push'
        run: |
          git bundle create verification-artifacts/candidate.bundle refs/heads/pdf-connected-candidate ^2a246b54bb29cbd844c77f06f8e3a20ddff8dcc7 ^3be1106b5cd34523c4746e2df6f123048beb5659
          git bundle verify verification-artifacts/candidate.bundle
      - name: Collect original browser receipts and images
        if: always()
        run: |
          if [ -d composer-broker-artifacts ]; then cp -a composer-broker-artifacts verification-artifacts/; fi
      - name: Preserve inspectable synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pdf-connected-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-artifacts/
          retention-days: 7
          if-no-files-found: error
  publish-isolated-candidate:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/work/pdf-connected-composition-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Publish tested source to a new branch only
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_SHA: ${{ needs.verify.outputs.candidate }}
          EXPECTED_TREE: ${{ needs.verify.outputs.tree }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$REPOSITORY" --name "pdf-connected-$RUN_ID-$ATTEMPT" --dir candidate-artifact
          git bundle verify candidate-artifact/candidate.bundle
          git fetch candidate-artifact/candidate.bundle refs/heads/pdf-connected-candidate
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse FETCH_HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(cat candidate-artifact/commit.txt)" = "$EXPECTED_SHA"
          test "$(cat candidate-artifact/tree.txt)" = "$EXPECTED_TREE"
          BRANCH="integration/pdf-connected-$RUN_ID-$ATTEMPT"
          git push --force-with-lease="refs/heads/$BRANCH:" origin "$EXPECTED_SHA:refs/heads/$BRANCH"
          printf 'New isolated candidate: %s at %s (tree %s)\n' "$BRANCH" "$EXPECTED_SHA" "$EXPECTED_TREE" | tee -a "$GITHUB_STEP_SUMMARY"
