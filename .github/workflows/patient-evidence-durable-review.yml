name: Authorized patient evidence durable run review

on:
  push:
    branches: [integration/patient-evidence-durable-review-20261102]
  pull_request:
    branches: [integration/patient-composer-knowledge-20261102]

permissions:
  contents: read

jobs:
  patient-review:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - name: Checkout review candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Syntax
        run: PYTHONPATH=src python -m compileall -q src tests
      - name: First-party patient/EHR/LIS/evidence/durable run acceptance
        run: PYTHONPATH=src python -m unittest discover -s tests -p test_patient_research_run_review.py -v
      - name: Source-owner patient knowledge integration
        run: PYTHONPATH=src python -m unittest discover -s tests -p test_patient_clinical_knowledge_integration.py -v
      - name: Full Python/HTTP regression
        run: PYTHONPATH=src python -m unittest discover -s tests -v
