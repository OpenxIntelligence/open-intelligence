name: Single-cell parser regression — synthetic fixtures only
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/research/single_cell_probe.py'
      - 'tools/research/test_single_cell_probe.py'
      - 'tools/research/test_sid_case_data_disabled.py'
      - '.github/workflows/single-cell-analysis.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fixture-only scientific parser dependencies
        run: |
          python -m pip install --only-binary=:all: numpy==2.3.5 h5py==3.15.1
      - name: Unit tests with invented fixture data only
        run: python -m unittest discover -s tools/research -p 'test_single_cell_probe.py' -v
      - name: Verify Sid dataset network acquisition is denied
        run: python -m unittest discover -s tools/research -p 'test_sid_case_data_disabled.py' -v
