name: Bounded single-cell investigation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/single-cell-analysis.yml'
      - 'tools/research/single_cell_probe.py'
      - 'tools/research/test_single_cell_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  single-cell:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Isolated HDF5 research environment, not application dependencies
        run: 'python -m pip install --only-binary=:all: numpy==2.3.5 h5py==3.15.1'
      - name: Complete research regression suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p sc-results
          python -m unittest discover -s tools/research -p 'test_*.py' -v 2>&1 | tee sc-results/tests.txt
      - name: Execute fixed-scope cell-localization analysis
        run: python tools/research/single_cell_probe.py --output sc-results/analysis.json
      - name: Preserve reproducibility and dependency receipt
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,subprocess,importlib.metadata
          from pathlib import Path
          paths=[Path('tools/research/single_cell_probe.py'),Path('tools/research/test_single_cell_probe.py'),Path('tools/research/public_case_intake.py'),Path('.github/workflows/single-cell-analysis.yml')]
          deps={n:{'version':importlib.metadata.version(n),'license':importlib.metadata.metadata(n).get('License-Expression') or importlib.metadata.metadata(n).get('License')} for n in ('numpy','h5py')}
          d={'checkout':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths},'research_dependencies':deps,'raw_matrices_published':False,'per_cell_records_published':False,'clinical_validation':False}
          Path('sc-results').mkdir(exist_ok=True)
          Path('sc-results/receipt.json').write_text(json.dumps(d,indent=2))
          PY
      - name: Retain aggregate findings and original code only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: single-cell-evidence
          path: |
            sc-results/*.json
            sc-results/tests.txt
            tools/research/*.py
            .github/workflows/single-cell-analysis.yml
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
