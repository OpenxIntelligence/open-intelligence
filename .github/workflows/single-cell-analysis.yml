name: Single-cell research archive (fictional unit tests only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/research/single_cell_probe.py'
      - 'tools/research/test_single_cell_probe.py'
      - 'tools/research/data_policy.py'
      - 'tools/research/test_restricted_research_entrypoints.py'
      - 'tools/research/test_sid_case_data_disabled.py'
      - '.github/workflows/single-cell-analysis.yml'

permissions:
  contents: read

jobs:
  offline-single-cell:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Enforce patient-data-independent CI
        run: python tools/audit_ci_data_boundaries.py
      - name: Install existing pinned dependencies for fictional HDF5 fixtures
        run: python -m pip install --only-binary=:all: numpy==2.3.5 h5py==3.15.1
      - name: Run independently authored fictional single-cell logic tests
        run: python -m unittest discover -s tools/research -p test_single_cell_probe.py -v
      # No processed patient H5AD, catalog, genomic file or research bucket is fetched.
      # Only generic offline helpers remain; case-specific analysis is retired.
