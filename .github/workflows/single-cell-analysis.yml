name: Synthetic-only single-cell methods regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/research/**'
      - '.github/workflows/single-cell-analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  single-cell-methods:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install isolated fixture-only test dependencies
        run: 'python -m pip install --only-binary=:all: numpy==2.3.5 h5py==3.15.1'
      - name: Offline independently authored fictional HDF5 fixtures
        run: |
          set -o pipefail
          mkdir -p sc-results
          python -m unittest discover -s tools/research -p 'test_single_cell_probe.py' -v 2>&1 | tee sc-results/tests.txt
      - name: Source-only test receipt
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess,importlib.metadata
          paths=[Path('tools/research/single_cell_probe.py'),Path('tools/research/test_single_cell_probe.py'),Path('.github/workflows/single-cell-analysis.yml')]
          d={'checkout':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
             'files':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths},
             'test_dependencies':{name:importlib.metadata.version(name) for name in ('numpy','h5py')},
             'network_patient_data_access':False,'source_patient_data_required':False,
             'clinical_validation':False}
          Path('sc-results').mkdir(exist_ok=True)
          Path('sc-results/receipt.json').write_text(json.dumps(d,indent=2))
          PY
      - name: Save fictional-methods regression receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-single-cell-regression
          path: sc-results/
          if-no-files-found: error
          retention-days: 7
