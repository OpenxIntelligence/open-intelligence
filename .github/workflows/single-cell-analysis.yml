name: Bounded single-cell investigation
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/single-cell-analysis.yml'
      - 'tools/research/single_cell_probe.py'
      - 'tools/research/test_single_cell_probe.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  single-cell:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Inspect only fixed public tumor-analysis metadata
        shell: bash
        run: |
          mkdir -p sc-results
          python - <<'PY'
          import json, hashlib, csv, io, re
          import urllib.request, urllib.parse, xml.etree.ElementTree as ET
          from pathlib import Path
          from datetime import datetime, timezone
          base='https://sid-sijbrandij-osteosarc-dataset.s3.us-west-2.amazonaws.com/'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): raise ValueError('redirect not allowed')
          op=urllib.request.build_opener(NoRedirect)
          def read(url,limit=4000000):
              with op.open(urllib.request.Request(url,headers={'User-Agent':'Open-Intelligence-research/1'}),timeout=45) as r:
                  b=r.read(limit+1)
              if len(b)>limit: raise ValueError('source limit')
              return b
          raw=read(base+'?list-type=2&prefix=kamil%2Ftumor%2Fanalysis%2F&max-keys=200')
          ns={'s':'http://s3.amazonaws.com/doc/2006-03-01/'}
          root=ET.fromstring(raw)
          rows=[{'key':x.findtext('s:Key',namespaces=ns),'bytes':int(x.findtext('s:Size',namespaces=ns))} for x in root.findall('s:Contents',ns)]
          out={'analysis_executed':False,'purpose':'inspect available processed schemas, not biological inference','retrieved_at':datetime.now(timezone.utc).isoformat(),'listing_sha256':hashlib.sha256(raw).hexdigest(),'listing_truncated':root.findtext('s:IsTruncated',namespaces=ns),'files':rows,'table_headers':[]}
          for x in rows:
              if x['key'].endswith(('.csv','.tsv','.txt')) and x['bytes']<20000000:
                  b=read(base+urllib.parse.quote(x['key'],safe='/'),20000000)
                  lines=b.decode('utf-8-sig').splitlines()
                  out['table_headers'].append({'key':x['key'],'sha256':hashlib.sha256(b).hexdigest(),'lines':len(lines),'header':lines[0][:4000] if lines else ''})
          html=read('https://osteosarc.com/app/',2000000).decode('utf-8')
          out['viewer_scripts']=re.findall(r'<script[^>]*src=[\"\']([^\"\']+)',html)
          out['viewer_config_lines']=[x[:1500] for x in html.splitlines() if any(t in x.lower() for t in ('dataset','manifest','config','dataurl'))][:20]
          Path('sc-results/source-discovery.json').write_text(json.dumps(out,indent=2))
          print(json.dumps({'files':len(rows),'table_headers':len(out['table_headers']),'analysis_executed':False}))
          PY
      - name: Preserve bounded source-discovery receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: single-cell-evidence
          path: |
            sc-results/*.json
            .github/workflows/single-cell-analysis.yml
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
