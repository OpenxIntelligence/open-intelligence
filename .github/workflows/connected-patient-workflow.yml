name: Connected patient workflow verification
on:
  push:
    branches: [work/connected-patient-composition-20261103]
    paths: ['.github/workflows/connected-patient-workflow.yml', 'tools/compose_connected_patient_workflow.py', 'tests/test_connected_patient_workflow.py', 'docs/engineering/CONNECTED_PATIENT_WORKFLOW.md']
  pull_request:
    branches: [integration/pwm-v2-report-review-20261102]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      candidate: ${{ steps.candidate.outputs.sha }}
      tree: ${{ steps.candidate.outputs.tree }}
    env:
      PYTHONPATH: src:tests:.
      OI_UI_ARTIFACT_DIR: verification-artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Reproduce pinned source composition
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          python tools/compose_connected_patient_workflow.py
          git add -A -- . ':!verification-artifacts'
          TREE=$(git write-tree)
          export GIT_AUTHOR_NAME='Open Intelligence integration'
          export GIT_AUTHOR_EMAIL='open-intelligence@outlook.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          CANDIDATE=$(printf '%s\n' 'Integrate existing patient record, evidence review, report and follow-through owners' | git commit-tree "$TREE" -p HEAD -p ad9713a443d2fe98e74f7d83605db776571e9929 -p 3df25cc417f308f7ea1247962656ffa2afc62d5d)
          git checkout --detach "$CANDIDATE"
          git update-ref refs/heads/connected-candidate "$CANDIDATE"
      - name: Record exact candidate
        id: candidate
        run: |
          mkdir -p verification-artifacts
          git rev-parse HEAD | tee verification-artifacts/commit.txt
          git rev-parse HEAD^{tree} | tee verification-artifacts/tree.txt
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"
          git archive --format=zip --output=verification-artifacts/source-under-test.zip HEAD
      - name: Compile and original JavaScript suites
        run: |
          set -euo pipefail
          python -m compileall -q src tests tools
          for file in web/*.js; do node --check "$file"; done
          node --test tests/test_*.js 2>&1 | tee verification-artifacts/javascript.txt
      - name: Complete Python and HTTP regression suite
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee verification-artifacts/python.txt
      - name: Original patient record and report journeys
        run: |
          set -euo pipefail
          python tests/browser_patient_record.py 2>&1 | tee verification-artifacts/patient-record.txt
          python tests/patient_report_followthrough_browser_journey.py 2>&1 | tee verification-artifacts/report-followthrough.txt
      - name: Original source, race, keyboard and Patient Mission journeys
        run: |
          set -euo pipefail
          for journey in browser_journey browser_source_dialogs ui_glance_journey patient_mission_browser_journey; do
            python "tests/$journey.py" 2>&1 | tee "verification-artifacts/$journey.txt"
          done
      - name: Bundle the verified candidate only
        if: github.event_name == 'push'
        run: |
          git bundle create verification-artifacts/candidate.bundle refs/heads/connected-candidate ^1d5cd0502b5789371165539149dcecad8df5e551 ^ad9713a443d2fe98e74f7d83605db776571e9929 ^3df25cc417f308f7ea1247962656ffa2afc62d5d
          git bundle verify verification-artifacts/candidate.bundle
      - name: Preserve reproducible synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: connected-patient-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-artifacts/
          retention-days: 7
          if-no-files-found: error
  publish-isolated-candidate:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/work/connected-patient-composition-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Publish tested commit to a new branch only
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_SHA: ${{ needs.verify.outputs.candidate }}
          EXPECTED_TREE: ${{ needs.verify.outputs.tree }}
        run: |
          set -euo pipefail
          gh run download "$RUN_ID" --repo "$REPOSITORY" --name "connected-patient-$RUN_ID-$ATTEMPT" --dir candidate-artifact
          git bundle verify candidate-artifact/candidate.bundle
          git fetch candidate-artifact/candidate.bundle refs/heads/connected-candidate
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse FETCH_HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(cat candidate-artifact/commit.txt)" = "$EXPECTED_SHA"
          test "$(cat candidate-artifact/tree.txt)" = "$EXPECTED_TREE"
          BRANCH="integration/connected-patient-workflow-$RUN_ID-$ATTEMPT"
          git push --force-with-lease="refs/heads/$BRANCH:" origin "$EXPECTED_SHA:refs/heads/$BRANCH"
          printf 'Published new isolated candidate: %s at %s (tree %s)\n' "$BRANCH" "$EXPECTED_SHA" "$EXPECTED_TREE" | tee -a "$GITHUB_STEP_SUMMARY"
