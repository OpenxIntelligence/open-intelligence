# Local synthetic-only composition root; no patient or domain ledger is created.
# The public fixture password below is not an operator or production credential.
# Image tags pin upstream patches, not immutable image digests. OS/container
# layers require their own inventory and rights review before distribution.
name: open-intelligence-h1-synthetic

x-api-common: &api-common
  # The reviewed wheel set is CPython 3.12 / Linux x86_64 only.
  platform: linux/amd64
  image: oi-h1-api:synthetic
  build:
    context: .
    dockerfile: Dockerfile
  environment:
    OI_API_ENVIRONMENT: synthetic
    OI_API_DATABASE_URL: postgresql+pg8000://oi_api:oi_h1_synthetic_only@db:5432/oi_api_synthetic
    OI_API_CONNECT_TIMEOUT_SECONDS: "2"
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  db:
    # Official PostgreSQL 16.15 release: 2026-08-13. No host database port.
    image: postgres:16.15-bookworm
    platform: linux/amd64
    environment:
      POSTGRES_DB: oi_api_synthetic
      POSTGRES_USER: oi_api
      POSTGRES_PASSWORD: oi_h1_synthetic_only
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "oi_api", "-d", "oi_api_synthetic"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - oi_api_synthetic_data:/var/lib/postgresql/data

  migrate:
    <<: *api-common
    command: ["python", "-m", "oi_api.migrate", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api-common
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).close()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  oi_api_synthetic_data:

# Runtime services need only their local database. Dependency downloads happen
# during the explicit image build, outside this internal service network.
networks:
  default:
    internal: true
